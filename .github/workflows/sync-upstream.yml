name: Sync from upstream

# 定期把上游 chen2he/orange-cloud 的 main 同步进本 fork 的 main，
# 同时保留本仓库自有的改动（如 build-ios.yml）。冲突时自动中止，不会强推覆盖。
on:
  schedule:
    # 每天 02:00 UTC（北京时间 10:00）；需要更频/更疏自行改 cron。
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_repo: chen2he/orange-cloud   # 上游仓库
          upstream_branch: main                 # 要拉取的上游分支
          target_branch: main                   # 同步进本仓库的分支
          merge_method: merge                   # 保留双方历史，merge 方式合并
          abort_on_conflict: true               # 有冲突就停手，不自动解决
          shallow_since: 1 day ago              # 只同步最近一天的提交，省资源