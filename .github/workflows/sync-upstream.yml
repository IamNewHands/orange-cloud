name: Sync from upstream

# 定期把上游 chen2he/orange-cloud 的 main 同步进本 fork 的 main，
# 同时保留本仓库自有的改动（如 build-ios.yml）。冲突时 action 会失败停止，不强推覆盖。
on:
  schedule:
    # 每天两次：04:00 UTC（北京时间 12:00）和 16:00 UTC（北京时间 24:00）；实际触发常有延迟。
    - cron: '0 4 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 该 action 需要在已检出的目标 git 仓库内运行，必须先 checkout 本 fork 的 main。
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync fork with upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: chen2he/orange-cloud   # 上游仓库
          upstream_sync_branch: main                 # 要拉取的上游分支
          target_sync_branch: main                   # 同步进本仓库的分支
          shallow_since: 1 day ago                   # 只同步最近一天的提交，省资源
          # 合并提交的作者署名（避免 git 因缺 author 报错）
          git_config_user: 'GitHub Actions'
          git_config_email: 'actions@users.noreply.github.com'